project:
  name: mc_rfm
  output_root: results_mc_rfm
  run_name: ""

seed: 42
device:
  amp: true
  amp_dtype: bfloat16
  num_workers: 8
  pin_memory: true
  deterministic: true

dataset:
  name: cifar100
  root: ./data
  image_size: 224
  train_split: train
  val_split: val
  test_split: test
  num_classes: 100
  download: true
  internal_val_ratio: 0.1
  internal_val_seed: 42
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]

model:
  backbone: vit_base_patch16_224
  pretrained: true
  feature_dim: 768
  bottleneck_dim: 256
  dh: 128
  de: 128
  hidden_dim: 512
  layers: 3
  learnable_curvature: false
  curvature: 0.5
  curvature_min: 1.0e-3
  geometry_mode: mixed
  decoupled_heads: true
  hyperbolic_scale_init: 0.08
  hyperbolic_scale_min: 0.01
  hyperbolic_scale_max: 0.35
  euclidean_scale_init: 1.0
  vector_field_h_input: logmap0

classifier:
  mode: hybrid
  prototype_shrinkage: 0.1
  gamma_h_init: 0.25
  gamma_e_init: 1.0
  beta_init: 0.5
  adaptive_branch_gate: true
  branch_gate_init: 0.5
  adaptive_beta: true
  gate_hidden_dim: 128

fewshot:
  shots: 4
  split_seed: 42
  split_dir: results_mc_rfm/fewshot_indices

cache:
  lmdb_dir: results_mc_rfm/lmdb
  map_size_gb: 16
  force_rebuild: false
  max_samples: 0

training:
  epochs: 50
  batch_size: 64
  effective_batch_size: 256
  lr: 5.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  warmup_epochs: 5
  lambda_euclidean: 1.0
  lambda_cls: 0.5
  label_smoothing: 0.1
  epsilon_t: 1.0e-3
  hyperbolic_loss_weighting: none
  riemannian_scale_clip: 10.0
  hyper_loss_warmup_epochs: 5
  hyper_loss_ramp_epochs: 10
  log_interval: 20

ode:
  solver: euler
  nfe: 3

eval:
  nfe: 3
  batch_size: 256

logging:
  summary_csv: results_mc_rfm/summary.csv
  json_indent: 2

hydra:
  run:
    dir: .
  output_subdir: null
